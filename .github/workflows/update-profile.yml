name: Update profile

on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths: ["scripts/**", ".github/workflows/**"] }

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate cards + latest updates
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a classic PAT (read:user, repo) as secret GH_STATS_TOKEN to include private contribution counts
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Publish SVGs to the stats branch
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "khanmashal156@gmail.com"
          cp -r dist /tmp/dist
          git add README.md && git diff --cached --quiet || git commit -m "chore: refresh latest updates" && git push || true
          git checkout --orphan stats && git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/dist/*.svg . && git add *.svg
          git commit -m "chore: refresh stats $(date -u +%F)" 
          git push -f origin stats

  pacman:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
